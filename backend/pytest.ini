[pytest]
# Run the suite WITHOUT pytest-flask, installed or not.
#
# That plugin is not in requirements.txt — CI installs that file and nothing else
# — but pip drags it onto plenty of dev machines. When it is loaded it wraps every
# test taking an `app` fixture in an autouse request context, so a test that
# forgets `with app.app_context():` still passes locally and fails only in CI with
# `RuntimeError: Working outside of application context`. That is exactly how
# test_face_mask_preview_progress.py went out green locally and 9-red in CI.
#
# This has to live in addopts, not in a conftest hook: by the time conftest.py is
# imported the entry-point plugins are already registered AND their fixtures are
# already parsed, so neither set_blocked() nor unregister() removes them (both
# were tried, both left the suite passing for the wrong reason).
# Same story for pytest-asyncio: not in requirements, dragged onto dev
# machines by pip, and its collection-time deprecation warning (loop scope
# unset) is the loudest residue once the app-side sweep landed. The suite
# has zero async tests - block it like pytest-flask above.
addopts = -p no:flask -p no:asyncio
markers =
    hf_gate: exercises the Hugging Face gate check itself; exempt from the autouse network guard
    ollama_fence: drives the local Ollama GPU fence itself; exempt from the autouse probe stub
    gpu_reading: calls system_stats.gpu_vram_used_gb for real (one nvidia-smi fork); exempt from the autouse stub that keeps the launch paths off the box's driver
    ollama_http: drives Ollama HTTP itself — the capabilities probes (/api/tags) or the vision calls (/api/generate); exempt from the autouse stubs that keep the suite off a real daemon
    lmstudio_http: drives LM Studio HTTP itself (port 1234); exempt from the same autouse guard, for the same reason
    live_ollama: opt-in integration check against a REAL local Ollama; skipped unless LDS_TEST_LIVE_OLLAMA=1
    live_ffmpeg: runs the REAL ffmpeg binary; skips itself when there is none. Not env-gated like live_ollama above — ffmpeg is a declared dependency of the video extra rather than a service somebody has to be running, so the honest gate is "is it installed", and on the machines that HAVE it this is the only thing that proves the filter chain still parses.
    live_xclip: runs the REAL XCLIP encoder end to end; opt-in via LDS_TEST_LIVE_XCLIP=1 because it downloads several hundred megabytes of weights. Env-gated rather than presence-gated like live_ffmpeg: the binary is a declared dependency somebody either has or has not, while this is a download the test would START, and a suite that reaches for the network on its own is not one anybody can trust offline.
