name: CI

# Heavy jobs are expensive, so we only pay for them when a run is worth it:
#   * pull_request        -> always (external contributions are the most valuable to gate)
#   * workflow_dispatch   -> always (manual button)
#   * push to main        -> when large enough OR when a Torch-sensitive path changes.
# A docs-only or small ordinary UI nudge to main therefore costs one cheap gate job.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Change-size gate
    runs-on: ubuntu-latest
    outputs:
      run_heavy: ${{ steps.decide.outputs.run_heavy }}
    steps:
      # Only a push needs history to measure its diff; PR/dispatch skip the checkout.
      - uses: actions/checkout@v4
        if: github.event_name == 'push'
        with:
          fetch-depth: 0

      - name: Decide whether the heavy jobs run
        id: decide
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail

          # PRs and manual runs always exercise the full suite.
          if [ "$EVENT" != "push" ]; then
            echo "Event '$EVENT' -> always run the heavy jobs."
            echo "run_heavy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A new branch or force-push gives no usable base to diff against
          # (before is all-zeros, or points at an overwritten commit we never
          # fetched). Treat that as "large" and run everything.
          zero="0000000000000000000000000000000000000000"
          if [ "$BEFORE" = "$zero" ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "No usable diff base ($BEFORE) -> run the heavy jobs."
            echo "run_heavy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The expensive CPU Torch overlay is path-gated in backend-tests. Any
          # push that could need it must first reach that Windows job, even when
          # the diff is smaller than the general heavy-job threshold below.
          torch_path_patterns=(
            '^backend/app/training_bridge/'
            '^backend/app/job_queue\.py$'
            '^backend/app/services/(aitoolkit_state_bridge|lora_training|run_environment|training_state_bundle|training_state_identity)\.py$'
            '^backend/app/routes/training\.py$'
            '^backend/app/services/checkpoint_registry\.py$'
            '^backend/tests/conftest\.py$'
            '^backend/tests/test_(aitoolkit_state_bridge|bank_busy_refusal|checkpoint_registry|continue_flexible|custom_base_paths|dev_requirements_contract|training_hf_auth|training_queue_atomic|training_routes|training_service|training_state_bundle|training_state_identity)\.py$'
            '^backend/requirements[^/]*\.txt$'
            '^backend/pytest\.ini$'
            '^\.github/workflows/'
          )

          is_torch_sensitive() {
            local path="$1"
            local pattern
            for pattern in "${torch_path_patterns[@]}"; do
              if [[ "$path" =~ $pattern ]]; then
                return 0
              fi
            done
            return 1
          }

          changed_paths=$(git diff --name-only --no-renames "$BEFORE" "$AFTER" --)
          torch_sensitive_paths=()
          while IFS= read -r path; do
            [ -z "${path:-}" ] && continue
            if is_torch_sensitive "$path"; then
              torch_sensitive_paths+=("$path")
            fi
          done <<< "$changed_paths"

          if [ "${#torch_sensitive_paths[@]}" -gt 0 ]; then
            printf 'Torch-sensitive path changed: %s\n' "${torch_sensitive_paths[@]}"
            echo "Torch-sensitive push -> run the heavy jobs."
            echo "run_heavy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Count changes only in the sources that can actually break the suite.
          # frontend/dist (build output), docs/** and every *.md are deliberately
          # excluded: a dist rebuild or a doc tweak must not trigger the full CI.
          # (dist and docs already fall outside the include list; the *.md exclude
          # catches markdown living inside backend/ or frontend/src/.)
          files=0
          lines=0
          while IFS=$'\t' read -r added deleted path; do
            [ -z "${path:-}" ] && continue
            files=$((files + 1))
            [ "$added" = "-" ] && added=0
            [ "$deleted" = "-" ] && deleted=0
            lines=$((lines + added + deleted))
          done < <(git diff --numstat "$BEFORE" "$AFTER" -- \
            backend/ frontend/src/ frontend/tests/ ':(exclude)*.md')

          echo "Source files changed: $files, lines changed: $lines"
          if [ "$files" -ge 5 ] || [ "$lines" -ge 100 ]; then
            echo "At or above threshold (>=5 files or >=100 lines) -> run the heavy jobs."
            echo "run_heavy=true" >> "$GITHUB_OUTPUT"
          else
            echo "Below threshold -> skip the heavy jobs on this push."
            echo "run_heavy=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    # Cheap and unconditional: correctness-class lint on both halves, on every
    # event — it is not behind the size gate because it costs a minute and the
    # things it catches (an unused import, a hook called under a condition, a
    # reference to a name that does not exist) hide just as well in a small push.
    # Run the same two commands locally: `ruff check .` at the repo root and
    # `npm run lint` in frontend/ (rules in ruff.toml / frontend/eslint.config.mjs).
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ruff (the version pinned in backend/requirements-dev.txt)
        shell: bash
        run: |
          set -euo pipefail
          pin=$(sed -n 's/^ruff==\([0-9][0-9A-Za-z.]*\).*$/\1/p' backend/requirements-dev.txt | head -n1)
          test -n "$pin" || { echo "backend/requirements-dev.txt no longer pins ruff" >&2; exit 1; }
          python -m pip install --quiet "ruff==$pin"

      - name: Ruff (backend, scripts, packaging)
        run: ruff check . --output-format github

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: ESLint (frontend)
        working-directory: frontend
        run: npm run lint

  backend-tests:
    name: Backend tests
    needs: gate
    if: needs.gate.outputs.run_heavy == 'true'
    # The portable app and its ai-toolkit/ComfyUI path contracts target Windows,
    # so the unit suite runs on the platform it ships for. Linux runtime viability
    # is covered independently by docker-smoke below.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The Torch overlay decision compares the checked-out revision with
          # the event base. A shallow clone cannot reliably resolve that base.
          fetch-depth: 0

      - name: Decide whether Torch-dependent tests need the CPU overlay
        id: torch_changes
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          function Write-TorchDecision {
            param(
              [bool] $RunTorch,
              [string] $Reason
            )

            $value = $RunTorch.ToString().ToLowerInvariant()
            Write-Host "$Reason -> run_torch=$value"
            "run_torch=$value" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }

          # A manual run is an explicit request for the complete backend suite.
          if ($env:EVENT_NAME -eq 'workflow_dispatch') {
            Write-TorchDecision $true 'Manual run'
            exit 0
          }

          $base = ("$env:BASE_SHA").Trim()
          $head = ("$env:HEAD_SHA").Trim()
          $zero = '0000000000000000000000000000000000000000'

          # Missing history, a new branch, or a rewritten base must never make
          # the Torch tests disappear silently. Unknown means run, fail-safe.
          if ([string]::IsNullOrWhiteSpace($base) -or $base -eq $zero) {
            Write-TorchDecision $true 'No usable diff base'
            exit 0
          }

          git cat-file -e "${base}^{commit}" 2>$null
          if ($LASTEXITCODE -ne 0) {
            Write-TorchDecision $true "Diff base $base is unavailable"
            exit 0
          }

          if ([string]::IsNullOrWhiteSpace($head)) {
            Write-TorchDecision $true 'No usable diff head'
            exit 0
          }

          git cat-file -e "${head}^{commit}" 2>$null
          if ($LASTEXITCODE -ne 0) {
            Write-TorchDecision $true "Diff head $head is unavailable"
            exit 0
          }

          $range = if ($env:EVENT_NAME -eq 'pull_request') {
            "${base}...${head}"
          } else {
            "${base}..${head}"
          }
          $changedPaths = @(git diff --name-only --no-renames $range --)
          if ($LASTEXITCODE -ne 0) {
            Write-TorchDecision $true "Could not diff $range"
            exit 0
          }

          # Keep this intentionally narrow: ordinary frontend/UI changes still
          # run the Windows backend suite when the outer gate asks for it, but
          # do not download the large CPU Torch wheel.
          $torchPathPatterns = @(
            '^backend/app/training_bridge/',
            '^backend/app/job_queue\.py$',
            '^backend/app/services/(aitoolkit_state_bridge|lora_training|run_environment|training_state_bundle|training_state_identity)\.py$',
            '^backend/app/routes/training\.py$',
            '^backend/app/services/checkpoint_registry\.py$',
            '^backend/tests/conftest\.py$',
            '^backend/tests/test_(aitoolkit_state_bridge|bank_busy_refusal|checkpoint_registry|continue_flexible|custom_base_paths|dev_requirements_contract|training_hf_auth|training_queue_atomic|training_routes|training_service|training_state_bundle|training_state_identity)\.py$',
            '^backend/requirements[^/]*\.txt$',
            '^backend/pytest\.ini$',
            '^\.github/workflows/'
          )

          $matchedPaths = [System.Collections.Generic.List[string]]::new()
          foreach ($changedPath in $changedPaths) {
            $normalizedPath = "$changedPath".Replace('\', '/')
            foreach ($pattern in $torchPathPatterns) {
              if ($normalizedPath -match $pattern) {
                $matchedPaths.Add($normalizedPath)
                break
              }
            }
          }

          if ($matchedPaths.Count -gt 0) {
            Write-TorchDecision $true "Torch-sensitive changes: $($matchedPaths -join ', ')"
          } else {
            Write-TorchDecision $false 'No Torch-sensitive changes'
          }

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          # Do not key/populate the shared pip cache with the large Torch wheel:
          # UI-only runs use this base cache and must not restore Torch bytes.
          cache-dependency-path: backend/requirements-dev.txt

      - name: Enforce release asset policy
        run: python scripts/check_release_artifacts.py

      - name: Test release asset guard
        run: python -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Install the test environment
        # Keep the shared base environment identical to a contributor install.
        # The large CPU Torch wheel is a separate, path-gated overlay below.
        run: python -m pip install --disable-pip-version-check -r backend/requirements-dev.txt

      - name: Install the CPU Torch test overlay
        if: steps.torch_changes.outputs.run_torch == 'true'
        run: python -m pip install --disable-pip-version-check --no-cache-dir -r backend/requirements-torch-tests.txt

      - name: Run backend tests
        # Parallel: xdist workers are separate processes and this suite was
        # hardened for it (in-memory SQLite per app instance, shared registries
        # reset by fixtures). `auto` sizes to the runner rather than pinning a
        # count — the local dev box uses 8, a 4-vCPU runner should use 4.
        # --basetemp: SHORT on purpose. The default runner temp path is already
        # deep, xdist appends /popen-gwN per worker on top, and
        # test_docker_launcher_fake_e2e asserts on a message PowerShell wraps by
        # path length — measured: it fails at the default path, passes at a short
        # one. D: is the runner's workspace drive.
        run: python -m pytest backend/tests -q -n auto --dist loadfile --basetemp=D:/t

  frontend-quality:
    name: Frontend tests and build
    needs: gate
    if: needs.gate.outputs.run_heavy == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run all frontend tests
        run: npm test

      - name: Build frontend
        # Proves the production build compiles. The tracked frontend/dist is a
        # committed artifact whose freshness is enforced at release time
        # (release.yml), not on every commit -- that keeps concurrent frontend
        # work from going red on a dist that simply has not been rebuilt yet.
        run: npm run build

  docker-smoke:
    name: Docker smoke test
    needs: gate
    if: needs.gate.outputs.run_heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build --tag lds-ci:${{ github.sha }} .

      - name: Start container
        run: docker run --detach --name lds-ci --publish 5050:5050 lds-ci:${{ github.sha }}

      - name: Wait for API health
        shell: bash
        run: |
          deadline=$((SECONDS + 120))
          until curl --fail --silent --show-error http://127.0.0.1:5050/api/health >/dev/null; do
            if (( SECONDS >= deadline )); then
              echo "::error::Docker API did not become healthy within 120 seconds"
              exit 1
            fi
            sleep 2
          done

      - name: Show container logs on failure
        if: failure()
        shell: bash
        run: |
          if docker container inspect lds-ci >/dev/null 2>&1; then
            docker logs lds-ci
          fi

      - name: Remove smoke-test container
        if: always()
        shell: bash
        run: |
          if docker container inspect lds-ci >/dev/null 2>&1; then
            docker rm --force lds-ci
          fi
