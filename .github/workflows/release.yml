# Release automation: push a tag `vYYYY.MM.DD[.N]` and this publishes a Windows
# source ZIP launched through start.bat. Binary launchers are intentionally not
# release assets. The in-app update check compares the latest release tag against
# backend/app/version.py, so the tag MUST match APP_VERSION — enforced below.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # create the release + upload the asset

jobs:
  build-and-release:
    runs-on: windows-latest
    env:
      # Keep the tag as data. Never splice an attacker-controlled Git ref into
      # a PowerShell script, where characters such as `$()` would be evaluated.
      RELEASE_REF_NAME: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Read history/tags without leaving a write-capable Git credential for
          # npm, pip, builds or tests executed later in this job.
          persist-credentials: false
          # The notes are the diff of frontend/src/whatsNew.js against the tag of
          # the LAST PUBLISHED GitHub release, so the job needs real history and
          # every tag - the default shallow, tag-less checkout cannot resolve it.
          fetch-depth: 0
          fetch-tags: true

      - name: Tag must match APP_VERSION
        shell: pwsh
        run: |
          $releaseRef = "$env:RELEASE_REF_NAME"
          if ($releaseRef -cnotmatch '^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}(?:\.[0-9]+)?$') {
            throw "invalid release tag format"
          }
          $v = (Select-String -Path backend/app/version.py -Pattern "APP_VERSION = '([^']+)'").Matches[0].Groups[1].Value
          if ("v$v" -cne $releaseRef) {
            throw "tag $releaseRef does not match APP_VERSION $v - bump backend/app/version.py first"
          }

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the release notes from 🎁 What's new
        shell: pwsh
        working-directory: frontend
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Runs BEFORE the 10-minute build on purpose: a release that announces
          # nothing must fail in seconds, not after packaging a ZIP nobody will
          # read notes for. Needs no npm install - node builtins only.
          # A deliberate plumbing-only release opts out in-band, by putting
          # [no-notes] in the annotated tag message.
          $msg = git tag -l --format='%(contents)' "$env:RELEASE_REF_NAME"
          $extra = @()
          if ("$msg" -match '\[no-notes\]') { $extra += '--allow-empty' }

          # Failed tag workflows may leave newer Git tags with NO release. Diff
          # from the last release users could actually download, never from the
          # nearest tag in Git history.
          $previousRelease = gh release list --limit 1 --exclude-drafts --exclude-pre-releases --json tagName --jq '.[0].tagName'
          if ($LASTEXITCODE -ne 0) {
            throw "cannot resolve the previous published GitHub release (gh release list exited $LASTEXITCODE)"
          }
          $previousRelease = "$previousRelease".Trim()
          if (-not $previousRelease) {
            throw "cannot resolve the previous published GitHub release: gh release list returned no release"
          }

          node scripts/releaseNotes.mjs --tag "$env:RELEASE_REF_NAME" --prev $previousRelease --out ../release-notes.md @extra
          if ($LASTEXITCODE -ne 0) { throw "release notes generation failed (exit $LASTEXITCODE)" }
          # Same body in the run log, so an empty or wrong release is visible
          # from the Actions page without downloading anything.
          Get-Content ../release-notes.md -Raw | Write-Host
          Get-Content ../release-notes.md -Raw >> $env:GITHUB_STEP_SUMMARY

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run all frontend tests
        working-directory: frontend
        run: npm test

      - name: Rebuild frontend
        working-directory: frontend
        run: npm run build

      - name: Note if the tracked frontend build differs from a fresh CI build
        shell: pwsh
        run: |
          # The step above rebuilt frontend/dist, and the ZIP packages THAT fresh
          # build — so the release artifact is never stale. A byte diff here only
          # means the committed dist was built on a different toolchain (e.g. a
          # newer Node minor than this runner), which is cosmetic for git-clone
          # users, not a stale release. Report it, don't block the release.
          $changes = @(git status --porcelain --untracked-files=all -- frontend/dist)
          if ($changes.Count -gt 0) {
            Write-Warning "Committed frontend/dist differs from a fresh CI build (toolchain drift). The ZIP ships the fresh build; consider recommitting dist from the release toolchain."
            $changes | ForEach-Object { Write-Host $_ }
          }

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the backend test environment
        # requirements-dev is the contributor environment; the pinned CPU
        # Torch wheel stays in a separate overlay so both contracts are clear.
        run: python -m pip install --disable-pip-version-check -r backend/requirements-dev.txt

      - name: Install the CPU Torch test overlay
        run: python -m pip install --disable-pip-version-check --no-cache-dir -r backend/requirements-torch-tests.txt

      - name: Enforce release asset policy
        run: python scripts/check_release_artifacts.py

      - name: Test release asset guard
        run: python -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Run the test suite
        # Parallel: xdist workers are separate processes and this suite was
        # hardened for it (in-memory SQLite per app instance, shared registries
        # reset by fixtures). `auto` sizes to the runner rather than pinning a
        # count — the local dev box uses 8, a 4-vCPU runner should use 4.
        # --basetemp: SHORT on purpose. The default runner temp path is already
        # deep, xdist appends /popen-gwN per worker on top, and
        # test_docker_launcher_fake_e2e asserts on a message PowerShell wraps by
        # path length — measured: it fails at the default path, passes at a short
        # one. D: is the runner's workspace drive.
        run: python -m pytest backend/tests -q -n auto --dist loadfile --basetemp=D:/t

      - name: Build the Windows source ZIP
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}   # stamps build_info.json in the bundle
        run: ./packaging/build_release_zip.ps1

      - name: Verify release archive policy
        run: python scripts/check_release_artifacts.py packaging/dist/LoRA-Dataset-Studio-windows.zip

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # release-notes.md was built at the top of this job: the install
          # preamble (the ZIP updates only from release to release, a git clone
          # updates from every commit - people cannot guess that, so every
          # release says it) followed by the 🎁 What's new entries this tag adds.
          #
          # --generate-notes is deliberately GONE. It builds "What's Changed"
          # from MERGED PULL REQUESTS, and everything here lands straight on
          # main - so it contributed an empty heading plus one useful line, the
          # Full Changelog compare link, which the generator now emits itself.
          # Three releases shipped a preamble-only body before that was noticed.
          gh release create "$env:RELEASE_REF_NAME" `
            "packaging/dist/LoRA-Dataset-Studio-windows.zip" `
            --title "LoRA Dataset Studio $env:RELEASE_REF_NAME" `
            --notes-file release-notes.md
